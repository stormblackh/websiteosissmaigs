<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FD8C5A" />
  <meta name="description" content="{{ site.description }}" />
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='images/favicon-64.png') }}" />
  <!-- Tailwind di-build statis (tools/build-css.sh) — bukan Play CDN lagi,
       supaya tidak ada kompilator CSS berat yang jalan di browser pengunjung. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css', v=asset_v) }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_v) }}" />
</head>
<body class="min-h-screen flex flex-col bg-orvelion-dark text-orvelion-lilac selection:bg-orvelion-coral selection:text-black">
  {% include "partials/icons.html" %}
  {% if show_chrome %}
    {% include "partials/navbar.html" %}
  {% endif %}
  <main class="flex-1 {% if show_chrome %}pt-20{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% if show_chrome %}
    {% include "partials/footer.html" %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/app.js', v=asset_v) }}"></script>
</body>
</html>

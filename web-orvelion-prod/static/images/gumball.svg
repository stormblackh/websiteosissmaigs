<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="gumball-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE5B4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFB7C5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AEC6CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gumball-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89D5F5"/>
      <stop offset="50%" stop-color="#4DBEE8"/>
      <stop offset="100%" stop-color="#219ED0"/>
    </linearGradient>
    <linearGradient id="gumball-sweater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EED9B7"/>
      <stop offset="100%" stop-color="#D7BE93"/>
    </linearGradient>
    <linearGradient id="gold-trophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DF9B00"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient background glow in festival pastel colors -->
  <circle cx="200" cy="240" r="170" fill="url(#gumball-glow)"/>

  <g filter="url(#soft-shadow)">
    <!-- TAIL -->
    <path d="M 140 370 Q 115 390 95 380 Q 80 370 85 355 Q 92 345 110 355 Q 128 365 145 360" fill="url(#gumball-blue)" stroke="#115474" stroke-width="4" stroke-linecap="round"/>

    <!-- LEGS -->
    <!-- Left Leg -->
    <rect x="162" y="360" width="16" height="50" rx="6" fill="#4A453F" stroke="#231F1D" stroke-width="3"/>
    <!-- Left Shoe -->
    <ellipse cx="166" cy="415" rx="16" ry="9" fill="url(#gumball-blue)" stroke="#115474" stroke-width="3"/>

    <!-- Right Leg -->
    <rect x="208" y="360" width="16" height="50" rx="6" fill="#4A453F" stroke="#231F1D" stroke-width="3"/>
    <!-- Right Shoe -->
    <ellipse cx="218" cy="415" rx="16" ry="9" fill="url(#gumball-blue)" stroke="#115474" stroke-width="3"/>

    <!-- BODY / SWEATER -->
    <path d="M 150 250 L 235 250 Q 250 280 245 355 L 142 355 Q 138 280 150 250 Z" fill="url(#gumball-sweater)" stroke="#2C231C" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Collar -->
    <path d="M 168 250 L 192 272 L 217 250 Z" fill="#8A4A28" stroke="#2C231C" stroke-width="3"/>
    <!-- Sweater cuffs & hems -->
    <line x1="144" y1="352" x2="243" y2="352" stroke="#8A4A28" stroke-width="4"/>

    <!-- LEFT ARM & HAND (Holding Trophy) -->
    <path d="M 152 265 Q 115 285 95 255" fill="none" stroke="url(#gumball-sweater)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 152 265 Q 115 285 95 255" fill="none" stroke="#2C231C" stroke-width="4" stroke-linecap="round"/>
    <!-- Left Paw -->
    <circle cx="92" cy="250" r="13" fill="url(#gumball-blue)" stroke="#115474" stroke-width="3"/>

    <!-- GOLDEN TROPHY "NORDELIA" -->
    <g transform="translate(48, 175)">
      <!-- Cup Body -->
      <path d="M 15 15 L 45 15 C 45 45 38 60 30 65 C 22 60 15 45 15 15 Z" fill="url(#gold-trophy)" stroke="#8F5E00" stroke-width="2.5"/>
      <!-- Handles -->
      <path d="M 15 22 C 3 22 3 45 16 48" fill="none" stroke="#8F5E00" stroke-width="3"/>
      <path d="M 45 22 C 57 22 57 45 44 48" fill="none" stroke="#8F5E00" stroke-width="3"/>
      <!-- Stem & Base -->
      <path d="M 27 65 L 33 65 L 34 76 L 26 76 Z" fill="url(#gold-trophy)" stroke="#8F5E00" stroke-width="2"/>
      <rect x="20" y="76" width="20" height="9" rx="2" fill="#5A2E12" stroke="#2F1607" stroke-width="1.5"/>
      <!-- Star on Trophy -->
      <polygon points="30,28 32,34 38,34 33,38 35,44 30,40 25,44 27,38 22,34 28,34" fill="#FFFFFF"/>
    </g>

    <!-- RIGHT ARM & CHEERING HAND -->
    <path d="M 235 265 Q 275 270 300 240" fill="none" stroke="url(#gumball-sweater)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 235 265 Q 275 270 300 240" fill="none" stroke="#2C231C" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Paw (Victory V-Sign) -->
    <circle cx="305" cy="235" r="14" fill="url(#gumball-blue)" stroke="#115474" stroke-width="3"/>
    <!-- Fingers cheering -->
    <path d="M 302 226 L 305 215 M 312 228 L 319 220" stroke="#115474" stroke-width="3" stroke-linecap="round"/>

    <!-- GUMBALL HEAD -->
    <!-- Left Ear -->
    <path d="M 115 110 C 95 65 130 50 145 75 Z" fill="url(#gumball-blue)" stroke="#115474" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 120 100 C 110 75 128 65 137 80 Z" fill="#F8A5B9"/>

    <!-- Right Ear -->
    <path d="M 245 75 C 260 50 295 65 275 110 Z" fill="url(#gumball-blue)" stroke="#115474" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 253 80 C 262 65 280 75 270 100 Z" fill="#F8A5B9"/>

    <!-- Head Oval -->
    <ellipse cx="195" cy="155" rx="88" ry="76" fill="url(#gumball-blue)" stroke="#115474" stroke-width="5"/>

    <!-- Cheek tufts / characteristic contour -->
    <path d="M 110 180 Q 95 188 112 202" fill="url(#gumball-blue)" stroke="#115474" stroke-width="4"/>
    <path d="M 280 180 Q 295 188 278 202" fill="url(#gumball-blue)" stroke="#115474" stroke-width="4"/>

    <!-- EYES -->
    <!-- Left Eye -->
    <ellipse cx="162" cy="142" rx="26" ry="32" fill="#FFFFFF" stroke="#115474" stroke-width="4"/>
    <ellipse cx="170" cy="142" rx="14" ry="17" fill="#1C1819"/>
    <circle cx="174" cy="136" r="4.5" fill="#FFFFFF"/>
    <circle cx="167" cy="148" r="2.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="225" cy="142" rx="26" ry="32" fill="#FFFFFF" stroke="#115474" stroke-width="4"/>
    <ellipse cx="218" cy="142" rx="14" ry="17" fill="#1C1819"/>
    <circle cx="222" cy="136" r="4.5" fill="#FFFFFF"/>
    <circle cx="215" cy="148" r="2.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M 145 106 Q 162 98 178 108" fill="none" stroke="#115474" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 212 108 Q 228 98 245 106" fill="none" stroke="#115474" stroke-width="4.5" stroke-linecap="round"/>

    <!-- NOSE & SNOUT -->
    <ellipse cx="193" cy="168" rx="8" ry="6" fill="#D94E64" stroke="#871A2A" stroke-width="2"/>

    <!-- HAPPY OPEN MOUTH -->
    <path d="M 160 176 Q 193 182 226 176 C 226 215 160 215 160 176 Z" fill="#75151E" stroke="#115474" stroke-width="4"/>
    <!-- Tooth -->
    <rect x="175" y="177" width="13" height="9" rx="2" fill="#FFFFFF"/>
    <!-- Tongue -->
    <path d="M 172 198 Q 193 188 214 198 Q 193 214 172 198 Z" fill="#FF7F92"/>

    <!-- WHISKERS -->
    <line x1="120" y1="162" x2="100" y2="158" stroke="#115474" stroke-width="3" stroke-linecap="round"/>
    <line x1="118" y1="172" x2="98" y2="175" stroke="#115474" stroke-width="3" stroke-linecap="round"/>
    <line x1="270" y1="162" x2="290" y2="158" stroke="#115474" stroke-width="3" stroke-linecap="round"/>
    <line x1="272" y1="172" x2="292" y2="175" stroke="#115474" stroke-width="3" stroke-linecap="round"/>

    <!-- Cute Blush -->
    <ellipse cx="128" cy="178" rx="12" ry="7" fill="#FFB7C5" opacity="0.7"/>
    <ellipse cx="258" cy="178" rx="12" ry="7" fill="#FFB7C5" opacity="0.7"/>
  </g>

  <!-- FESTIVAL BADGE "NORDELIA 2026" -->
  <g transform="translate(200, 448)">
    <rect x="-85" y="-18" width="170" height="34" rx="17" fill="#FFB7C5" stroke="#FFFFFF" stroke-width="2.5" filter="url(#soft-shadow)"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#5C1F32" text-anchor="middle" letter-spacing="1.5">NORDELIA • IGS</text>
  </g>
</svg>

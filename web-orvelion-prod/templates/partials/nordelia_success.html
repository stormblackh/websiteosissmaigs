<div id="modal-registered" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md"
     data-group-link="{{ group_link or '' }}"
     data-group-label="{{ group_label or 'Masuk Grup LINE' }}">
  <div class="relative w-full max-w-md rounded-3xl p-6 sm:p-8 bg-[#0F172A] border border-[#F5D061]/40 shadow-[0_25px_60px_rgba(0,0,0,0.8),0_0_35px_rgba(245,208,97,0.18)] shadow-2xl text-center">
    <button type="button" id="btn-close-registered" class="absolute top-4 right-4 p-2 rounded-full bg-white/10 text-stone-300 hover:text-white" aria-label="Tutup">
      <svg class="w-5 h-5"><use href="#i-x"></use></svg>
    </button>

    <div class="mx-auto w-16 h-16 rounded-full flex items-center justify-center bg-gradient-to-tr from-[#38BDF8] via-[#FDE68A] to-[#F5D061] text-[#0B1120] text-black mb-4">
      <svg class="w-8 h-8"><use href="#i-check"></use></svg>
    </div>

    <p class="text-[10px] font-black uppercase tracking-[0.2em] text-[#FDE68A] mb-2">Nordelia 2026</p>
    <h3 class="text-2xl sm:text-3xl font-black text-white leading-tight">
      Kamu sudah terdaftar
    </h3>
    <p id="registered-detail" class="mt-2 text-sm text-stone-300">
      Pendaftaranmu sudah dicatat panitia.
    </p>

    <div class="mt-5 p-4 rounded-2xl bg-black/60 border border-white/10 text-left space-y-3">
      <p class="text-[11px] font-black uppercase tracking-wider text-emerald-400 flex items-center gap-1.5"><svg class="w-3.5 h-3.5"><use href="#i-message"></use></svg><span>Grup LINE Resmi Peserta</span></p>
      <p class="text-xs text-stone-300">
        Wajib bergabung ke grup LINE resmi lomba ini agar info teknis, jadwal tanding, dan arahan panitia tidak terlewatkan.
      </p>
      <a id="btn-join-group" href="#" target="_blank" rel="noopener noreferrer"
         class="hidden w-full py-3.5 rounded-xl font-black text-xs uppercase tracking-wider bg-[#06C755] hover:bg-[#05b34c] text-white text-center shadow-lg shadow-emerald-500/20 hover:scale-[1.01] transition-all flex items-center justify-center gap-2">
        Masuk Grup
      </a>
      <div id="group-link-empty" class="hidden text-[11px] text-[#FF7A00] bg-black/60 border border-[#38BDF8]/30 rounded-xl px-3 py-2">
        Link grup belum diisi panitia. Isi <span class="font-mono text-white">NORDELIA_GROUP_LINK</span> di file <span class="font-mono text-white">.env</span>.
      </div>
    </div>

    <button type="button" id="btn-registered-done"
            class="mt-5 w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider text-stone-200 bg-white/10 hover:bg-white/15 border border-white/10">
      Selesai
    </button>
  </div>
</div>

<script>
(function () {
  const modal = document.getElementById("modal-registered");
  if (!modal) return;

  function closeAndReload() {
    modal.classList.add("hidden");
    document.body.classList.remove("overflow-hidden");
    window.location.reload();
  }

  document.getElementById("btn-close-registered")?.addEventListener("click", closeAndReload);
  document.getElementById("btn-registered-done")?.addEventListener("click", closeAndReload);
  modal.addEventListener("click", function (e) {
    if (e.target === modal) closeAndReload();
  });

  window.showNordeliaRegisteredPopup = function (opts) {
    opts = opts || {};
    const detail = document.getElementById("registered-detail");
    const joinBtn = document.getElementById("btn-join-group");
    const emptyBox = document.getElementById("group-link-empty");
    const nama = opts.participantName || "";
    const cabang = opts.cabangName || "";
    if (detail) {
      detail.textContent = [nama, cabang].filter(Boolean).length
        ? (nama ? nama : "Peserta") + " sudah terdaftar di " + (cabang || "cabang lomba ini") + "."
        : "Pendaftaranmu sudah dicatat panitia.";
    }

    const groupLink = (opts.groupLink || modal.getAttribute("data-group-link") || "").trim();
    const groupLabel = (opts.groupLabel || modal.getAttribute("data-group-label") || "Masuk Grup LINE").trim();

    if (groupLink) {
      if (joinBtn) {
        joinBtn.href = groupLink;
        joinBtn.textContent = groupLabel;
        joinBtn.classList.remove("hidden");
      }
      if (emptyBox) emptyBox.classList.add("hidden");
    } else {
      if (joinBtn) joinBtn.classList.add("hidden");
      if (emptyBox) emptyBox.classList.remove("hidden");
    }

    modal.classList.remove("hidden");
    document.body.classList.add("overflow-hidden");
  };
})();
</script>

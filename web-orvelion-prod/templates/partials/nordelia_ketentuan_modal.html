<!-- ========================================================================= -->
<!-- MODAL KETENTUAN & JUKNIS LOMBA LENGKAP -->
<!-- ========================================================================= -->
<div id="modal-ketentuan" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
  <div class="relative w-full max-w-2xl rounded-3xl p-6 sm:p-8 bg-[#0F172A] border border-[#F5D061]/40 shadow-[0_25px_60px_rgba(0,0,0,0.85),0_0_35px_rgba(245,208,97,0.15)] max-h-[92vh] overflow-y-auto shadow-2xl">
    
    <button type="button" id="btn-close-ketentuan-modal" class="absolute top-5 right-5 p-2 rounded-full bg-white/10 text-stone-300 hover:text-white" aria-label="Tutup">
      <svg class="w-5 h-5"><use href="#i-x"></use></svg>
    </button>

    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-2xl flex items-center justify-center bg-gradient-to-tr from-[#38BDF8] via-[#FDE68A] to-[#F5D061] text-[#0B1120] font-black">
        <svg class="w-5 h-5"><use href="#i-trophy"></use></svg>
      </div>
      <div>
        <span id="ketentuan-category-badge" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-white/10 text-[#FBBF24]">
          Petunjuk Teknis & Ketentuan
        </span>
        <h3 id="ketentuan-modal-title" class="text-xl sm:text-2xl font-black text-white">Ketentuan Lomba</h3>
      </div>
    </div>

    <!-- Highlight Meta Box: Tema, Deadline, Biaya -->
    <div id="ketentuan-meta-box" class="p-4 rounded-2xl bg-black/50 border border-white/10 space-y-2 mb-5">
      <!-- Injected dynamically -->
    </div>

    <!-- Sections (Peserta, Karya, Pengumpulan, dsb.) -->
    <div id="ketentuan-sections-container" class="space-y-4 mb-6">
      <!-- Injected dynamically -->
    </div>

    <!-- Bottom Actions -->
    <div class="pt-4 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div id="ketentuan-modal-email-notice" class="hidden text-[11px] text-amber-200/95 font-medium flex items-center gap-1.5 text-center sm:text-left">
        <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-width="2" d="M12 16v-4m0-4h.01"/></svg>
        <span>Gunakan akun email resmi sekolah untuk mendaftar.</span>
      </div>
      <div class="flex flex-col sm:flex-row items-center justify-end gap-3 w-full sm:w-auto">
        <button type="button" id="btn-close-ketentuan-footer" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-bold text-stone-300 bg-white/10 hover:bg-white/15 hover:text-white transition-colors">
          Tutup
        </button>
        <a id="ketentuan-modal-juknis-btn"
           href="#"
           target="_blank"
           rel="noopener noreferrer"
           class="hidden w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-bold text-[#FDE68A] bg-white/[0.06] hover:bg-white/[0.12] border border-[#F5D061]/35 hover:border-[#F5D061]/70 transition-all flex items-center justify-center gap-2 shadow-sm hover:scale-[1.01]">
          <svg class="w-4 h-4 text-[#F5D061]"><use href="#i-sparkles"></use></svg>
          <span>Lihat Ketentuan & Juknis Lengkap</span>
        </a>
        <a id="ketentuan-modal-gform-btn"
           href="#"
           target="_blank"
           rel="noopener noreferrer"
           class="hidden w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider text-[#0B1120] bg-gradient-to-r from-[#FDE68A] via-[#F5D061] to-[#E5B869] hover:brightness-110 shadow-lg transition-transform hover:scale-[1.01] flex items-center justify-center gap-2">
          <svg class="w-4 h-4"><use href="#i-external"></use></svg>
          <span>Buka Formulir Pendaftaran (Google Form)</span>
        </a>
        <button type="button"
                id="ketentuan-modal-inapp-reg-btn"
                class="hidden w-full sm:w-auto px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider text-[#0B1120] bg-gradient-to-r from-[#FDE68A] via-[#F5D061] to-[#E5B869] hover:brightness-110 shadow-lg transition-transform hover:scale-[1.01] flex items-center justify-center gap-2">
          <span>Daftar Lomba Ini</span>
          <span class="text-sm font-bold">&rarr;</span>
        </button>
      </div>
    </div>

  </div>
</div>

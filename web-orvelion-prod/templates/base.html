<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FF6B00" />
  <meta name="description" content="{{ site.description }}" />
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/orvelion.jpg') }}" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nordelia: {
              gold: "#F5D061",
              goldSoft: "#FDE68A",
              goldDark: "#D4AF37",
              champagne: "#FBEFCD",
              amber: "#F3C77C",
              blue: "#38BDF8",
              cyan: "#0EA5E9",
              sky: "#7DD3FC",
              ice: "#F0F9FF",
              pink: "#FDA4AF",
              dark: "#080E1A",
              surface: "#0F172A",
              card: "#16223D",
            },
            orvelion: {
              coral: "#FF6B00",
              rust: "#CC4400",
              peach: "#E5E5E5",
              ember: "#B33800",
              apricot: "#FF8533",
              amber: "#FF7A00",
              lilac: "#FFFFFF",
              blush: "#FFFFFF",
              rose: "#E5E5E5",
              dark: "#0a0a0a",
              surface: "#121212",
              card: "#181818",
              orange: "#FF6B00",
              darkorange: "#CC4400",
              black: "#000000",
              white: "#FFFFFF",
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="min-h-screen flex flex-col bg-orvelion-dark text-white selection:bg-orvelion-coral selection:text-black">
  {% include "partials/icons.html" %}
  {% if show_chrome %}
    {% include "partials/navbar.html" %}
  {% endif %}
  <main class="flex-1 {% if show_chrome %}pt-20{% endif %}">
    {% block content %}{% endblock %}
  </main>
  {% if show_chrome %}
    {% include "partials/footer.html" %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/pjax.js', v=asset_v('js/pjax.js')) }}"></script>
  <script src="{{ url_for('static', filename='js/app.js', v=asset_v('js/app.js')) }}"></script>
</body>
</html>
